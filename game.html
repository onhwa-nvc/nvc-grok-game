<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NVC 그로그 카드 놀이 - 메인 로비</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #fcf9f2;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
        }
        .lobby-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #e6ded1;
            width: 90%; max-width: 420px;
            text-align: center;
        }
        h1 { color: #334155; font-size: 24px; margin-bottom: 8px; }
        p { color: #64748b; font-size: 13px; margin-bottom: 30px; }
        
        .menu-section {
            display: flex; flex-direction: column; gap: 14px;
        }
        .input-box {
            width: 100%; padding: 12px;
            border: 1px solid #cbd5e1; border-radius: 10px;
            font-size: 15px; text-align: center; outline: none;
            background-color: #f8fafc;
        }
        .input-box:focus { border-color: #be185d; background-color: #fff; }

        .main-btn {
            background-color: #be185d; color: #ffffff;
            border: none; border-radius: 10px; padding: 14px;
            font-size: 15px; font-weight: bold; cursor: pointer;
            transition: background-color 0.2s;
        }
        .main-btn:hover { background-color: #9d174d; }

        .sub-btn {
            background-color: #f1f5f9; color: #475569;
            border: 1px solid #cbd5e1;
        }
        .sub-btn:hover { background-color: #e2e8f0; }

        .divider {
            margin: 10px 0; border-top: 1px dashed #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="lobby-container">
        <h1>NVC 그로그 카드 놀이</h1>
        <p>마음을 나누는 따뜻한 소통 공간</p>

        <div class="menu-section">
            <!-- 방장으로 새 방 만들기 -->
            <button class="main-btn" onclick="createRoom()">새 방 만들기 (방장)</button>
            
            <div class="divider"></div>

            <!-- 참여자로 방 코드 입력 후 입장 -->
            <input type="text" id="roomCodeInput" class="input-box" placeholder="4자리 방 코드 입력">
            <button class="main-btn sub-btn" onclick="joinRoom()">방 입장하기</button>
        </div>
    </div>

    <script>
        const socket = io(window.location.origin, {
            path: '/socket.io',
            transports: ['websocket', 'polling']
        });

        function createRoom() {
            socket.emit('createRoom');
        }

        socket.on('roomCreated', (roomCode) => {
            // 방장 권한(host=true)을 가지고 게임방으로 이동
            location.href = `game.html?room=${roomCode}&host=true`;
        });

        function joinRoom() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if (!code) {
                alert("방 코드를 입력해주세요!");
                return;
            }
            socket.emit('checkRoomExists', code);
        }

        socket.on('roomCheckResult', (data) => {
            if (data.exists) {
                location.href = `game.html?room=${data.roomCode}`;
            } else {
                alert("존재하지 않거나 방장에 의해 종료된 방입니다.");
            }
        });
    </script>
</body>
</html>
