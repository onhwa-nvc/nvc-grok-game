### 1. 컴퓨터 화면: 메뉴바(작업표시줄)를 위쪽으로 배치하기

사용 중이신 운영체제에 따라 다음 방법으로 메뉴바를 위로 옮기실 수 있습니다.

*   **Windows 10 / 11:**
    1.  작업표시줄의 빈 곳을 **마우스 우클릭**합니다.
    2.  `작업 표시줄 설정`으로 들어갑니다 (Windows 11의 경우 '작업 표시줄 동작' 확장).
    3.  또는 간단하게 작업표시줄 빈 공간을 우클릭한 후 **'작업 표시줄 잠금'을 해제**한 뒤, 마우스로 드래그하여 **화면 맨 위쪽으로 끌어다 놓으시면** 이동됩니다. (※ Windows 11 최신 버전 일부 환경에서는 레지스트리 수정이 필요할 수 있으나, 기본적으로 드래그나 설정 메뉴를 지원합니다.)
*   **Mac (macOS):**
    1.  화면 왼쪽 상단의 **사과 아이콘() > 시스템 설정**(또는 시스템 환경설정)을 엽니다.
    2.  **'데스크탑 및 Dock'** 메뉴를 클릭합니다.
    3.  '화면에서의 Dock 위치' 항목을 **'상단'**으로 변경해 줍니다.

---

### 2. 스마트폰 화면: 세로 모드에서 동서남북 비율을 가로로 꽉 차게 맞추기

스마트폰에서 지도나 방위(동서남북) 화면을 볼 때 세로 모드에서 폭이 좁아 답답하셨군요. 이 부분은 보고 계신 서비스나 앱의 레이아웃 특성에 기인한 경우가 많습니다. 아래 방법을 시도해 보세요.

*   **화면 회전 고정 해제하기:** 스마트폰 상단바(제어 센터)를 내려 **'세로 방향 고정'을 끄고** 폰을 **가로로 눕혀서** 확인해 보세요. 가로 모드에서는 화면이 좌우로 넓어져 동서남북 배치가 훨씬 여유로워집니다.
*   **브라우저 '데스크톱 사이트' 모드 활용:** 모바일 웹사이트로 접속 중이시라면, 브라우저 메뉴(우측 상단 점 3개 등)에서 **'데스크톱 사이트 보기'**를 체크해 보세요. PC 화면 기준으로 전체 비율이 잡히면서 동서남북 배치가 한눈에 들어오도록 조정될 수 있습니다.
