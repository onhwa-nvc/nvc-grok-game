<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NVC 그로그 카드 놀이 - 로비</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #fcf9f2;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
        }
        .lobby-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid #e6ded1;
            width: 90%; max-width: 400px;
            text-align: center;
        }
        h2 { color: #334155; margin-bottom: 20px; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .input-box {
            width: 100%; padding: 12px;
            border: 1px solid #cbd5e1; border-radius: 10px;
            font-size: 15px; text-align: center; outline: none;
        }
        .action-btn {
            background-color: #be185d; color: #ffffff;
            border: none; border-radius: 10px; padding: 12px;
            font-size: 15px; font-weight: bold; cursor: pointer;
            transition: background-color 0.2s;
        }
        .action-btn:hover { background-color: #9d174d; }
        .sub-btn {
            background-color: #f1f5f9; color: #475569;
            border: 1px solid #cbd5e1;
        }
        .sub-btn:hover { background-color: #e2e8f0; }
    </style>
</head>
<body>

    <div class="lobby-card">
        <h2>NVC 그로그 카드 놀이</h2>
        <div class="btn-group">
            <button class="action-btn" onclick="createRoom()">방 만들기 (방장)</button>
            <div style="margin: 10px 0; border-top: 1px dashed #cbd5e1;"></div>
            <input type="text" id="roomCodeInput" class="input-box" placeholder="4자리 방 코드 입력">
            <button class="action-btn sub-btn" onclick="joinRoom()">방 입장하기</button>
        </div>
    </div>

    <script>
        const socket = io(window.location.origin, {
            path: '/socket.io',
            transports: ['websocket', 'polling']
        });

        function createRoom() {
            // 방장 권한으로 새 방 생성 요청
            socket.emit('createRoom');
        }

        socket.on('roomCreated', (roomCode) => {
            // 방 생성 성공 시 방장 권한 토큰과 함께 게임방으로 이동
            location.href = `game.html?room=${roomCode}&host=true`;
        });

        function joinRoom() {
            const code = document.getElementById('roomCodeInput').value.trim();
            if (!code) {
                alert("방 코드를 입력해주세요!");
                return;
            }
            // 방 존재 여부 확인 후 입장
            socket.emit('checkRoomExists', code);
        }

        socket.on('roomCheckResult', (data) => {
            if (data.exists) {
                location.href = `game.html?room=${data.roomCode}`;
            } else {
                alert("존재하지 않거나 방장에 의해 종료된 방입니다.");
            }
        });
    </script>
</body>
</html>
